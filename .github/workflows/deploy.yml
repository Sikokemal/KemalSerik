name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject API Key and Verify
        run: |
          # Файлдардың бар-жоғын тексеру
          echo "Checking files..."
          ls -l
          
          if [ ! -f "codebatle.html" ]; then echo "Error: codebatle.html not found"; exit 1; fi
          if [ ! -f "TaskAi.html" ]; then echo "Error: TaskAi.html not found"; exit 1; fi

          # Кілтті енгізу
          echo "Injecting API Key..."
          sed -i "s/REPLACE_ME_WITH_API_KEY/${{ secrets.GEMINI_API_KEY }}/g" codebatle.html
          sed -i "s/REPLACE_ME_WITH_API_KEY/${{ secrets.GEMINI_API_KEY }}/g" TaskAi.html  
          sed -i "s/REPLACE_ME_WITH_API_KEY/${{ secrets.GEMINI_API_KEY }}/g" Planlesson.html
          sed -i "s/REPLACE_ME_WITH_API_KEY/${{ secrets.GEMINI_API_KEY }}/g" generatorLecture.html

          # Енгізу сәтті болғанын тексеру (маркер қалмауы керек)
          if grep -q "REPLACE_ME_WITH_API_KEY" TaskAi.html; then
            echo "Error: API Key NOT injected into TaskAi.html. Placeholder still exists."
            exit 1
          fi
          echo "Success: API Key injected into files."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
