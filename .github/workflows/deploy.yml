name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Егер тармағың 'master' болса, осы жерді өзгерт

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject API Key
        run: |
          # index.html ішіндегі REPLACE_ME_WITH_API_KEY мәтінін Secret-тегі кілтпен ауыстырады
          sed -i "s/REPLACE_ME_WITH_API_KEY/${{ secrets.GEMINI_API_KEY }}/g" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Барлық файлдарды жүктейді

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
