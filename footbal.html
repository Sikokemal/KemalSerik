<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futbol Party: Без Правил (Нет Аутов)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        #game-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .score-board {
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 20px;
            font-size: 60px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            color: white;
        }

        .score-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 30px;
            border-radius: 20px;
            display: flex;
            gap: 20px;
            backdrop-filter: blur(5px);
        }

        .red-score { color: #ff6b6b; }
        .blue-score { color: #4ecdc4; }
        
        .controls-hint {
            text-align: center;
            padding-bottom: 20px;
            color: white;
            font-size: 16px;
            text-shadow: 1px 1px 2px black;
            opacity: 0.9;
        }

        .control-group {
            display: inline-block;
            margin: 0 30px;
            background: rgba(0,0,0,0.6);
            padding: 15px;
            border-radius: 15px;
            vertical-align: bottom;
        }

        .key {
            display: inline-block;
            background: #eee;
            color: #333;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 3px 0 #999;
            margin: 0 3px;
        }

        .action-key {
            background: #ffd700;
            color: #000;
        }

        #goal-message {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 90px;
            color: gold;
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 0 0 30px orange, 4px 4px 0px #000;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 10;
            text-align: center;
            white-space: nowrap;
        }

        #goal-message.show {
            transform: translate(-50%, -50%) scale(1);
        }

        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            pointer-events: auto;
            z-index: 20;
        }

        h1 {
            font-size: 60px;
            text-shadow: 0 5px 15px rgba(0,0,0,0.5);
            margin-bottom: 10px;
            font-style: italic;
        }
        
        button {
            padding: 20px 50px;
            font-size: 28px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 0 #c0392b;
            margin-top: 40px;
            font-family: inherit;
            font-weight: bold;
            transition: all 0.1s;
        }
        button:active {
            transform: translateY(8px);
            box-shadow: none;
        }
        button:hover {
            background: #ff8787;
        }

        #loading {
            position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 24px; font-weight: bold;
            display: block;
        }
    </style>
</head>
<body>

<div id="game-container"></div>

<!-- Экран загрузки и старта -->
<div id="loading">Загрузка ресурсов...</div>
<div id="start-screen" style="display: none;">
    <h1>FUTBOL PARTY</h1>
    <p style="font-size: 20px; opacity: 0.9;">Неуклюжий футбол: Никаких аутов, только голы!</p>
    <button onclick="startGame()">ИГРАТЬ</button>
</div>

<!-- Интерфейс игры -->
<div id="ui-layer" style="display: none;">
    <div class="score-board">
        <div class="score-box">
            <span class="red-score" id="score-red">0</span>
            <span>-</span>
            <span class="blue-score" id="score-blue">0</span>
        </div>
    </div>
    <div id="goal-message">ГОЛ!</div>
    <div class="controls-hint">
        <div class="control-group">
            <div style="color:#ff6b6b; font-weight:bold; font-size: 20px; margin-bottom: 5px;">МИШКА</div>
            <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> - Бег<br>
            <span class="key">Space</span> - Прыжок<br>
            <span class="key action-key">F</span> - ПНУТЬ!
        </div>
        <div class="control-group">
            <div style="color:#4ecdc4; font-weight:bold; font-size: 20px; margin-bottom: 5px;">ЗАЯЦ</div>
            <span class="key">Стрелки</span> - Бег<br>
            <span class="key">Enter</span> - Прыжок<br>
            <span class="key action-key">Shift</span> - ПНУТЬ!
        </div>
    </div>
</div>

<!-- Библиотеки -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>

<script>
    // --- Глобальные переменные ---
    let scene, camera, renderer, world;
    let ball, player1, player2;
    let spectators = [];
    let isGameRunning = false;
    let scores = { red: 0, blue: 0 };
    let keys = {};
    let audioCtx;
    let isGoalProcessing = false;

    // Материалы
    let matGround, matPlayer, matBall, matWall;

    window.addEventListener('load', () => {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('start-screen').style.display = 'flex';
    });

    function startGame() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('ui-layer').style.display = 'flex';
        
        initAudio();
        initGame();
        
        isGameRunning = true;
        animate();
    }

    // --- Звуки ---
    function initAudio() {
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch(e) { console.log("Audio not supported"); }
    }

    function playSound(type) {
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'whistle') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(2500, now);
            osc.frequency.linearRampToValueAtTime(1500, now + 0.15);
            gainNode.gain.setValueAtTime(0.4, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
        } else if (type === 'kick') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
            gainNode.gain.setValueAtTime(0.8, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'cheer') {
            const bufferSize = audioCtx.sampleRate * 2.0;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 800;
            
            noise.connect(filter);
            filter.connect(gainNode);
            gainNode.gain.setValueAtTime(0.3, now);
            gainNode.gain.linearRampToValueAtTime(0, now + 2.0);
            noise.start(now);
        }
    }

    // --- Инициализация игры ---
    function initGame() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 35, 45);
        camera.lookAt(0, 0, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('game-container').appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(30, 60, 30);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        world = new CANNON.World();
        world.gravity.set(0, -25, 0); 
        world.broadphase = new CANNON.NaiveBroadphase();
        world.solver.iterations = 10;

        matGround = new CANNON.Material();
        matPlayer = new CANNON.Material();
        matBall = new CANNON.Material();
        matWall = new CANNON.Material();

        const cp = new CANNON.ContactMaterial(matGround, matPlayer, { friction: 0.0, restitution: 0.0 });
        const cb = new CANNON.ContactMaterial(matGround, matBall, { friction: 0.4, restitution: 0.7 });
        const cpb = new CANNON.ContactMaterial(matPlayer, matBall, { friction: 0.2, restitution: 0.8 });
        const cwb = new CANNON.ContactMaterial(matWall, matBall, { friction: 0.0, restitution: 0.8 }); // Стены скользкие и пружинистые
        
        world.addContactMaterial(cp);
        world.addContactMaterial(cb);
        world.addContactMaterial(cpb);
        world.addContactMaterial(cwb);

        createEnvironment();
        createCharacters();
        createBall();

        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if(e.code === 'KeyF') kick(player1);
            if(e.code === 'ShiftRight' || e.code === 'KeyM') kick(player2);
        });
        window.addEventListener('keyup', e => keys[e.code] = false);
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    }

    function createEnvironment() {
        const groundGeo = new THREE.BoxGeometry(54, 1, 34);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x7cfc00 });
        const groundMesh = new THREE.Mesh(groundGeo, groundMat);
        groundMesh.position.y = -0.5;
        groundMesh.receiveShadow = true;
        scene.add(groundMesh);

        const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(27, 0.5, 17)), material: matGround });
        groundBody.position.set(0, -0.5, 0);
        world.addBody(groundBody);
        
        const linesGeo = new THREE.PlaneGeometry(50, 30);
        const linesMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6, wireframe: true, linewidth: 2 });
        const lines = new THREE.Mesh(linesGeo, linesMat);
        lines.rotation.x = -Math.PI/2;
        lines.position.y = 0.02;
        scene.add(lines);

        // === СТЕНЫ-КЛЕТКА ===
        // Увеличиваем высоту стен до 30, чтобы мяч не вылетал
        
        // Длинные стены (верх и низ)
        createWall(0, 15, -16, 52, 30, 1, 0.1); // Полупрозрачные
        createWall(0, 15, 16, 52, 30, 1, 0.1);

        // Боковые стены (С ДЫРКАМИ ДЛЯ ВОРОТ!)
        // Левая сторона
        createWall(-26, 15, -10.5, 1, 30, 11, 0.1); // Верхняя часть
        createWall(-26, 15, 10.5, 1, 30, 11, 0.1);  // Нижняя часть
        // Стена НАД воротами слева (чтобы мяч не улетал выше ворот)
        createWall(-26, 18, 0, 1, 24, 10, 0.1); // Начинается с высоты 6 (верх перекладины) до 30
        
        // Правая сторона
        createWall(26, 15, -10.5, 1, 30, 11, 0.1);
        createWall(26, 15, 10.5, 1, 30, 11, 0.1); 
        // Стена НАД воротами справа
        createWall(26, 18, 0, 1, 24, 10, 0.1);

        createNetBox(-28, 0x4ecdc4); 
        createNetBox(28, 0xff6b6b);  

        createBleachers(-22, 0);
        createBleachers(24, Math.PI);
    }

    function createWall(x, y, z, w, h, d, opacity = 0.4) {
        const geo = new THREE.BoxGeometry(w, h, d);
        // Используем depthWrite: false для корректной прозрачности
        const mat = new THREE.MeshLambertMaterial({ color: 0xffffff, opacity: opacity, transparent: true, depthWrite: false });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x,y,z);
        scene.add(mesh);

        const body = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2)), material: matWall });
        body.position.set(x,y,z);
        world.addBody(body);
    }

    function createNetBox(x, color) {
        const sign = x > 0 ? -1 : 1;
        const postMat = new THREE.MeshStandardMaterial({color: 0xffffff});
        const p1 = new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.3,6), postMat); 
        p1.position.set(x + (2 * sign), 3, 5); scene.add(p1);
        
        const p2 = new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.3,6), postMat); 
        p2.position.set(x + (2 * sign), 3, -5); scene.add(p2);
        
        const cross = new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.3,10), postMat); 
        cross.rotation.x = Math.PI/2; 
        cross.position.set(x + (2 * sign), 6, 0); 
        scene.add(cross);

        const backWallBody = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(1, 3, 6)), material: matWall });
        backWallBody.position.set(x, 3, 0);
        world.addBody(backWallBody);
        
        const netGeo = new THREE.BoxGeometry(4, 6, 10);
        const netMat = new THREE.MeshBasicMaterial({ color: color, wireframe: true, transparent: true, opacity: 0.3 });
        const net = new THREE.Mesh(netGeo, netMat);
        net.position.set(x, 3, 0);
        scene.add(net);
    }

    function createBleachers(z, ry) {
        const group = new THREE.Group();
        const stepMat = new THREE.MeshLambertMaterial({color: 0x999999});
        for(let i=0; i<3; i++) {
            const step = new THREE.Mesh(new THREE.BoxGeometry(50, 1, 2), stepMat);
            step.position.set(0, i*1, -(i*2));
            group.add(step);
            
            for(let j=-22; j<22; j+=3) {
                if(Math.random()>0.3) {
                    const fan = createFanMesh(Math.random()>0.5 ? 0xff6b6b : 0x4ecdc4);
                    fan.position.set(j + Math.random(), i*1+1, -(i*2));
                    group.add(fan);
                    spectators.push({ mesh: fan, baseY: fan.position.y, speed: 4 + Math.random()*5 });
                }
            }
        }
        group.position.z = z;
        group.rotation.y = ry;
        scene.add(group);
    }

    function createFanMesh(color) {
        const g = new THREE.Group();
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.5, 8), new THREE.MeshLambertMaterial({color:color}));
        body.position.y = 0.75;
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 8), new THREE.MeshLambertMaterial({color:0xffccaa}));
        head.position.y = 1.6;
        g.add(body); g.add(head);
        return g;
    }

    function createCharacters() {
        player1 = createPlayer(0xff6b6b, -10, 'bear');
        player2 = createPlayer(0x4ecdc4, 10, 'bunny');
    }

    function createPlayer(color, x, type) {
        const group = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.4 });

        const bodyGeo = new THREE.CylinderGeometry(1, 1, 1.5, 12);
        const bodyMesh = new THREE.Mesh(bodyGeo, mat);
        bodyMesh.position.y = 0; 
        
        const topGeo = new THREE.SphereGeometry(1, 12, 12, 0, Math.PI*2, 0, Math.PI/2);
        const topMesh = new THREE.Mesh(topGeo, mat); 
        topMesh.position.y = 0.75; 

        const botGeo = new THREE.SphereGeometry(1, 12, 12, 0, Math.PI*2, Math.PI/2, Math.PI/2);
        const botMesh = new THREE.Mesh(botGeo, mat); 
        botMesh.position.y = -0.75; 
        
        group.add(bodyMesh); group.add(topMesh); group.add(botMesh);
        group.castShadow = true;

        const eyeMat = new THREE.MeshBasicMaterial({color:0x000000});
        const eyeGeo = new THREE.SphereGeometry(0.2, 8, 8);
        const e1 = new THREE.Mesh(eyeGeo, eyeMat); e1.position.set(0.4, 0.5, 0.85);
        const e2 = new THREE.Mesh(eyeGeo, eyeMat); e2.position.set(-0.4, 0.5, 0.85);
        group.add(e1); group.add(e2);

        if(type === 'bear') {
             const earGeo = new THREE.SphereGeometry(0.35, 8, 8);
             const el = new THREE.Mesh(earGeo, mat); el.position.set(0.8, 1.2, 0);
             const er = new THREE.Mesh(earGeo, mat); er.position.set(-0.8, 1.2, 0);
             group.add(el); group.add(er);
        } else {
             const earGeo = new THREE.CylinderGeometry(0.2, 0.2, 1.5, 8);
             const el = new THREE.Mesh(earGeo, mat); el.position.set(0.5, 2.0, 0); el.rotation.z = -0.3;
             const er = new THREE.Mesh(earGeo, mat); er.position.set(-0.5, 2.0, 0); er.rotation.z = 0.3;
             group.add(el); group.add(er);
        }

        scene.add(group);

        const body = new CANNON.Body({
            mass: 10,
            shape: new CANNON.Sphere(1),
            material: matPlayer,
            linearDamping: 0.5, 
            angularDamping: 0.99,
            fixedRotation: true
        });
        body.position.set(x, 1, 0);
        world.addBody(body);

        return { mesh: group, body: body, startX: x };
    }

    function createBall() {
        const radius = 1.3;
        const cvs = document.createElement('canvas'); cvs.width=128; cvs.height=128;
        const c = cvs.getContext('2d');
        c.fillStyle='#eeeeee'; c.fillRect(0,0,128,128);
        c.fillStyle='#222222'; 
        c.beginPath(); c.arc(64,64,25,0,Math.PI*2); c.fill();
        c.beginPath(); c.arc(0,0,30,0,Math.PI*2); c.fill();
        c.beginPath(); c.arc(128,128,30,0,Math.PI*2); c.fill();
        c.beginPath(); c.arc(0,128,30,0,Math.PI*2); c.fill();
        c.beginPath(); c.arc(128,0,30,0,Math.PI*2); c.fill();
        
        const mesh = new THREE.Mesh(new THREE.SphereGeometry(radius, 24, 24), new THREE.MeshStandardMaterial({map:new THREE.CanvasTexture(cvs), roughness:0.2}));
        mesh.castShadow = true;
        scene.add(mesh);

        const body = new CANNON.Body({
            mass: 0.8,
            shape: new CANNON.Sphere(radius),
            material: matBall,
            linearDamping: 0.2,
            angularDamping: 0.2
        });
        body.position.set(0, 5, 0);
        world.addBody(body);

        ball = { mesh: mesh, body: body };
    }

    function kick(player) {
        if (!isGameRunning) return;
        
        const pPos = player.body.position;
        const bPos = ball.body.position;
        const dx = bPos.x - pPos.x;
        const dz = bPos.z - pPos.z;
        const dist = Math.sqrt(dx*dx + dz*dz);

        if (dist < 4.5) {
            playSound('kick');
            const forceX = (dx / dist) * 60;
            const forceZ = (dz / dist) * 60;
            const forceY = 20;

            ball.body.velocity.x += forceX;
            ball.body.velocity.z += forceZ;
            ball.body.velocity.y += forceY;
            
            player.mesh.position.y += 0.5;
            setTimeout(() => { player.mesh.position.y -= 0.5; }, 100);
        }
    }

    function resetPositions(isGoal) {
        player1.body.position.set(-10, 1, 0);
        player1.body.velocity.set(0,0,0);
        
        player2.body.position.set(10, 1, 0);
        player2.body.velocity.set(0,0,0);
        
        ball.body.velocity.set(0,0,0);
        ball.body.angularVelocity.set(0,0,0);
        
        if (isGoal) {
            ball.body.position.set(0, 8, 0);
        } else {
            // Фолбек: если что-то пошло не так, возвращаем в центр
            ball.body.position.set(0, 3, 0);
        }

        isGoalProcessing = false;
        document.getElementById('goal-message').classList.remove('show');
    }

    function animate() {
        if(!isGameRunning) return;
        requestAnimationFrame(animate);

        world.step(1/60);

        movePlayer(player1, keys['KeyW'], keys['KeyS'], keys['KeyA'], keys['KeyD'], keys['Space']);
        movePlayer(player2, keys['ArrowUp'], keys['ArrowDown'], keys['ArrowLeft'], keys['ArrowRight'], keys['Enter']);

        player1.mesh.position.copy(player1.body.position);
        player2.mesh.position.copy(player2.body.position);
        
        ball.mesh.position.copy(ball.body.position);
        ball.mesh.quaternion.copy(ball.body.quaternion);

        const time = Date.now() * 0.005;
        spectators.forEach(s => {
            s.mesh.position.y = s.baseY + Math.max(0, Math.sin(time * s.speed) * 0.5);
        });

        if (!isGoalProcessing) {
            const bPos = ball.body.position;
            
            // --- ЛОГИКА ГОЛА ---
            if (Math.abs(bPos.z) < 5.5 && bPos.y < 6) { 
                if (bPos.x < -25) handleGoal('blue'); 
                else if (bPos.x > 25) handleGoal('red'); 
            }
            
            // --- ЛОГИКА БЕЗОПАСНОСТИ ---
            // Аут убран. Мяч может только упасть сквозь текстуры (глюк физики).
            if (bPos.y < -10) {
                resetPositions(false);
            }
        }

        renderer.render(scene, camera);
    }

    function movePlayer(p, up, down, left, right, jump) {
        const speed = 25;
        const vel = p.body.velocity;
        
        let dx = 0, dz = 0;
        if(up) dz = -1;
        if(down) dz = 1;
        if(left) dx = -1;
        if(right) dx = 1;

        if(dx !== 0 || dz !== 0) {
            vel.x = dx * speed;
            vel.z = dz * speed;
            p.mesh.rotation.y = Math.atan2(dx, dz);
            p.mesh.rotation.x = Math.sin(Date.now() * 0.02) * 0.2;
        } else {
            vel.x *= 0.8;
            vel.z *= 0.8;
            p.mesh.rotation.x *= 0.8;
        }

        if(jump && p.body.position.y < 1.5) {
            vel.y = 18;
        }
    }

    function handleGoal(team) {
        isGoalProcessing = true;
        playSound('whistle');
        setTimeout(() => playSound('cheer'), 100);

        const msg = document.getElementById('goal-message');
        if(team === 'red') {
            scores.red++;
            document.getElementById('score-red').innerText = scores.red;
            msg.innerText = "ГОЛ МИШКИ!";
            msg.style.color = "#ff6b6b";
        } else {
            scores.blue++;
            document.getElementById('score-blue').innerText = scores.blue;
            msg.innerText = "ГОЛ ЗАЙЦА!";
            msg.style.color = "#4ecdc4";
        }
        msg.classList.add('show');
        setTimeout(() => resetPositions(true), 2500);
    }

</script>
</body>
</html>
