<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Жекпе-жегі: Cyber Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --p1-neon: #3b82f6;
            --p2-neon: #f43f5e;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #010103;
            color: #e2e8f0;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        .grid-bg {
            background-image: linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            mask-image: radial-gradient(circle at center, black 40%, transparent 95%);
        }

        @keyframes shake-intense {
            0%, 100% { transform: translate(0, 0); }
            10%, 30%, 50%, 70%, 90% { transform: translate(-8px, -2px); }
            20%, 40%, 60%, 80% { transform: translate(8px, 2px); }
        }

        .animate-shake { animation: shake-intense 0.4s cubic-bezier(.36,.07,.19,.97) both; }

        .scanline {
            width: 100%; height: 2px; z-index: 100;
            background: rgba(255, 255, 255, 0.03);
            position: absolute; top: 0;
            pointer-events: none;
            animation: scan 4s linear infinite;
        }

        @keyframes scan { to { top: 100%; } }

        .hp-bar-fill {
            transition: width 1s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .btn-cyber {
            clip-path: polygon(12% 0, 100% 0, 100% 75%, 88% 100%, 0 100%, 0 25%);
            transition: all 0.2s ease;
        }
        
        .btn-cyber:hover:not(:disabled) {
            transform: scale(1.02);
            filter: brightness(1.2);
        }

        .avatar-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid rgba(255,255,255,0.05);
            cursor: pointer;
        }
        .avatar-card.selected {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.15);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }

        .lockout-overlay {
            background: rgba(0,0,0,0.85);
            backdrop-blur: 10px;
        }

        .loading-pulse {
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.3; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1); }
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="fixed inset-0 grid-bg pointer-events-none"></div>
<div class="scanline"></div>
<div id="app" class="relative z-10"></div>

<script>
    // ВС КОДЕ: Осы жерге apiKey қоюды ұмытпаңыз
    const apiKey = "REPLACE_ME_WITH_API_KEY";
    
    const PYTHON_BASE = [
        { q: "Python-да айнымалыға мән беру таңбасы?", options: ["=", "==", ":=", "->"], correct: 0 },
        { q: "Экранға шығару функциясы?", options: ["echo", "log", "print", "write"], correct: 2 },
        { q: "Тізім (list) құру жақшасы?", options: ["()", "{}", "[]", "<>"], correct: 2 },
        { q: "Дерек түрін қалай тексереді?", options: ["check()", "type()", "kind()", "var()"], correct: 1 },
        { q: "Циклді тоқтату операторы?", options: ["exit", "stop", "break", "end"], correct: 2 },
        { q: "Бүтін санды бөлу (целое деление)?", options: ["/", "%", "//", "div"], correct: 2 },
        { q: "Сөздік (dict) құру жақшасы?", options: ["[]", "()", "{}", "<>"], correct: 2 },
        { q: "Жол ұзындығын анықтау?", options: ["size()", "len()", "length()", "count()"], correct: 1 },
        { q: "Түсініктеме таңбасы?", options: ["//", "/*", "#", "--"], correct: 2 },
        { q: "range(5) қандай саннан басталады?", options: ["1", "0", "5", "-1"], correct: 1 }
    ];

    let gameQuestions = [...PYTHON_BASE];

    const ATTACK_MODES = [
        { id: 'standard', name: 'ШАБУЫЛ', icon: 'swords', damage: 20, selfDmg: 10, heal: 0, color: 'bg-blue-600' },
        { id: 'mega', name: 'ЖОЮ (1 рет)', icon: 'skull', damage: 65, selfDmg: 45, heal: 0, color: 'bg-orange-600' },
        { id: 'drain', name: 'СІҢІРУ', icon: 'activity', damage: 15, selfDmg: 5, heal: 25, color: 'bg-emerald-600' }
    ];

    const AVATARS = ['ghost', 'flame', 'zap', 'shield', 'rocket', 'cpu'];

    let state = {
        gameState: 'menu', 
        qIdx: 0,
        hp: [100, 100],
        hasAnswered: [false, false],
        selectedAtk: [ATTACK_MODES[0], ATTACK_MODES[0]],
        megaUsed: [false, false], 
        winner: null,
        anim: null,
        topic: "Python негіздері",
        playerNames: ["Protocol Alpha", "Protocol Beta"],
        playerIcons: ["ghost", "flame"],
        loadingMsg: ""
    };

    /**
     * ГАРАНТИРОВАННАЯ ГЕНЕРАЦИЯ ЧЕРЕЗ GEMINI API
     */
    async function fetchQuestions(topic) {
        state.gameState = 'generating';
        state.loadingMsg = "AI ЖҮЙЕСІНЕ ҚОСЫЛУДА...";
        render();

        const systemPrompt = `Сен интеллектуалды жекпе-жекке арналған сұрақтар генераторысың. Пайдаланушы берген тақырып бойынша 10 қиын сұрақ дайында. Тіл: Қазақша. Формат: JSON.`;
        const userQuery = `Тақырып: ${topic}. Сұрақ саны: 10.`;

        const payload = {
            contents: [{ parts: [{ text: userQuery }] }],
            systemInstruction: { parts: [{ text: systemPrompt }] },
            generationConfig: {
                responseMimeType: "application/json",
                responseSchema: {
                    type: "OBJECT",
                    properties: {
                        questions: {
                            type: "ARRAY",
                            items: {
                                type: "OBJECT",
                                properties: {
                                    q: { type: "STRING" },
                                    options: { type: "ARRAY", items: { type: "STRING" }, minItems: 4, maxItems: 4 },
                                    correct: { type: "NUMBER" }
                                },
                                required: ["q", "options", "correct"]
                            }
                        }
                    },
                    required: ["questions"]
                }
            }
        };

        const callAPIWithRetry = async (retries = 5, delay = 1000) => {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error('API Error');
                const result = await response.json();
                const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!text) throw new Error('Empty result');
                
                return JSON.parse(text);
            } catch (err) {
                if (retries > 0) {
                    state.loadingMsg = `ҚАЙТА ТАЛПЫНУ (${6-retries}/5)...`;
                    render();
                    await new Promise(r => setTimeout(r, delay));
                    return callAPIWithRetry(retries - 1, delay * 2);
                }
                throw err;
            }
        };

        try {
            const data = await callAPIWithRetry();
            if (data && data.questions && Array.isArray(data.questions)) {
                gameQuestions = data.questions.map(q => ({
                    q: q.q || "Протокол жүктелмеді",
                    options: (Array.isArray(q.options) && q.options.length === 4) ? q.options : ["A", "B", "C", "D"],
                    correct: typeof q.correct === 'number' ? q.correct : 0
                }));
            }
            startBattleFlow();
        } catch (e) {
            console.error("AI Error, fallback to base:", e);
            gameQuestions = [...PYTHON_BASE];
            startBattleFlow();
        }
    }

    function startBattleFlow() {
        state.gameState = 'round_sync';
        state.loadingMsg = "ДЕРЕКТЕРДІ СИНХРОНИЗАЦИЯЛАУ...";
        state.qIdx = 0;
        state.hp = [100, 100];
        state.megaUsed = [false, false];
        state.hasAnswered = [false, false];
        render();
        
        setTimeout(() => {
            state.gameState = 'battle';
            render();
        }, 1800);
    }

    function render() {
        const app = document.getElementById('app');
        if (!app) return;

        if (state.gameState === 'menu') {
            app.innerHTML = `
                <div class="min-h-screen flex flex-col items-center justify-center p-4 text-center">
                    <div class="mb-6 floating text-blue-500"><i data-lucide="zap" class="w-20 h-20"></i></div>
                    <h1 class="text-6xl font-black italic uppercase tracking-tighter text-white mb-2">SPEED <span class="text-blue-500">DUEL</span></h1>
                    <p class="text-[10px] text-slate-500 uppercase tracking-[0.5em] mb-12 font-bold opacity-60 italic text-blue-400">Stable Protocol v19.0</p>
                    <button onclick="state.gameState = 'setup'; render();" class="btn-cyber px-20 py-6 bg-blue-600 text-white font-black text-2xl hover:bg-blue-400 transition-all shadow-lg">
                        БАСТАУ
                    </button>
                </div>
            `;
        } else if (state.gameState === 'setup') {
            app.innerHTML = `
                <div class="min-h-screen flex flex-col items-center justify-center p-8 overflow-y-auto bg-black">
                    <h2 class="text-2xl font-black italic mb-10 uppercase tracking-widest text-white">ШAЙҚАС ПАРАМЕТРЛЕРІ</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-10 w-full max-w-5xl mb-12">
                        ${[0, 1].map(p => `
                            <div class="bg-white/5 border border-white/10 p-8 rounded-[3rem] backdrop-blur-md">
                                <h3 class="text-[10px] font-black uppercase text-slate-500 mb-6 text-center tracking-widest italic">TEAM ${p+1}</h3>
                                <input type="text" value="${state.playerNames[p]}" oninput="state.playerNames[${p}] = this.value"
                                    class="w-full bg-black/40 border border-white/10 rounded-2xl px-6 py-4 mb-8 outline-none focus:border-blue-500 text-center font-bold text-white uppercase text-sm">
                                <div class="grid grid-cols-3 gap-3">
                                    ${AVATARS.map(icon => `
                                        <div onclick="state.playerIcons[${p}] = '${icon}'; render();" 
                                            class="avatar-card p-5 bg-black/40 rounded-2xl flex items-center justify-center ${state.playerIcons[p] === icon ? 'selected' : 'opacity-20'}">
                                            <i data-lucide="${icon}" class="w-8 h-8 text-white"></i>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="w-full max-w-sm">
                        <label class="block text-[10px] font-black text-slate-500 mb-2 uppercase tracking-widest text-center">Тақырыпты жазыңыз:</label>
                        <input type="text" id="topicInput" value="${state.topic}" oninput="state.topic = this.value"
                            class="w-full bg-white/5 border border-white/10 rounded-2xl px-6 py-4 mb-6 text-sm font-bold text-center outline-none focus:border-blue-500 text-white">
                        <button onclick="handleStart()" class="w-full py-6 bg-blue-600 rounded-2xl font-black text-xl hover:bg-blue-400 shadow-xl transition-all shadow-blue-900/20">ДАЙЫНБЫЗ!</button>
                    </div>
                </div>
            `;
        } else if (state.gameState === 'generating' || state.gameState === 'round_sync') {
            app.innerHTML = `
                <div class="min-h-screen flex flex-col items-center justify-center p-4">
                    <div class="relative w-32 h-32 mb-10">
                        <div class="absolute inset-0 border-8 border-blue-500/10 rounded-full"></div>
                        <div class="absolute inset-0 border-8 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                    </div>
                    <div class="text-sm font-black uppercase tracking-[0.4em] text-blue-400 loading-pulse mb-2 tracking-[0.5em]">
                        ${state.gameState === 'generating' ? 'AI ГЕНЕРАЦИЯ' : 'РАУНДТЫ ЖҮКТЕУ'}
                    </div>
                    <div class="text-[9px] font-bold text-slate-600 uppercase tracking-widest italic">${state.loadingMsg || 'Жүктелуде...'}</div>
                </div>
            `;
        } else if (state.gameState === 'result') {
            const winIdx = state.winner;
            app.innerHTML = `
                <div class="min-h-screen flex flex-col items-center justify-center text-center p-6 bg-black">
                    <div class="mb-10 text-yellow-500 floating"><i data-lucide="trophy" class="w-40 h-40"></i></div>
                    <h1 class="text-6xl font-black mb-12 italic uppercase tracking-tighter ${winIdx === 0 ? 'text-blue-500' : 'text-rose-500'}">
                        ${state.playerNames[winIdx]}<br><span class="text-white">DOMINANCE</span>
                    </h1>
                    <button onclick="location.reload()" class="btn-cyber px-20 py-6 bg-white text-black font-black rounded-full hover:bg-blue-600 hover:text-white transition-all">ҚАЙТАЛАУ</button>
                </div>
            `;
        } else {
            const q = gameQuestions[state.qIdx];
            if (!q || !q.options) return;

            app.innerHTML = `
                <div class="min-h-screen flex flex-col ${state.anim ? 'animate-shake' : ''}">
                    <!-- HUD -->
                    <div class="grid grid-cols-2 h-24 border-b border-white/5 bg-black/90 backdrop-blur-xl z-50">
                        ${[0, 1].map(p => `
                            <div class="flex items-center px-10 gap-6 ${p === 1 ? 'flex-row-reverse text-right border-l border-white/5' : ''}">
                                <div class="w-16 h-16 rounded-3xl ${p === 0 ? 'bg-blue-600 shadow-[0_0_20px_rgba(59,130,246,0.3)]' : 'bg-rose-600 shadow-[0_0_20px_rgba(244,63,94,0.3)]'} flex items-center justify-center shrink-0">
                                    <i data-lucide="${state.playerIcons[p]}" class="w-8 h-8 text-white"></i>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="flex justify-between items-end mb-2">
                                        <span class="text-[10px] font-black uppercase text-slate-500 truncate tracking-widest">${state.playerNames[p]}</span>
                                        <span class="text-sm font-black mono text-white">${state.hp[p]}%</span>
                                    </div>
                                    <div class="h-3 bg-slate-900 rounded-full overflow-hidden p-[2px]">
                                        <div class="hp-bar-fill h-full rounded-full ${p === 0 ? 'bg-blue-500' : 'bg-rose-500'}" style="width: ${state.hp[p]}%"></div>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <!-- Arena Center -->
                    <div class="flex-1 flex flex-col items-center justify-center p-8 relative overflow-hidden bg-black">
                        <div class="max-w-4xl w-full text-center py-16 px-12 bg-white/5 border border-white/10 rounded-[4rem] backdrop-blur-xl shadow-2xl relative">
                            <div class="absolute -top-5 left-1/2 -translate-x-1/2 bg-blue-600 text-[10px] font-black px-6 py-2 rounded-full uppercase tracking-widest shadow-lg italic tracking-[0.2em]">STAGE ${state.qIdx + 1} / 10</div>
                            <h2 class="text-2xl md:text-4xl font-black leading-tight mb-4 text-white uppercase italic tracking-tight">${q.q}</h2>
                        </div>
                        
                        ${state.anim ? `
                            <div class="absolute inset-0 flex items-center justify-center z-50 pointer-events-none">
                                <div class="bg-black/95 backdrop-blur-xl text-4xl font-black px-16 py-8 rounded-3xl border-2 ${state.anim.type === 'hit' ? 'border-emerald-500 text-emerald-400' : 'border-rose-500 text-rose-400'} animate-bounce shadow-2xl">
                                    ${state.anim.text}
                                </div>
                            </div>
                        ` : ''}
                    </div>

                    <!-- Duel Area -->
                    <div class="grid grid-cols-2 h-[45vh] border-t border-white/10 bg-black/60 backdrop-blur-2xl">
                        ${[0, 1].map(pIdx => `
                            <div class="flex flex-col p-8 gap-6 relative ${pIdx === 0 ? 'bg-blue-500/5' : 'bg-rose-500/5'} ${state.hasAnswered[pIdx] ? 'disabled-zone' : ''}">
                                <div class="flex gap-3 mb-2">
                                    ${ATTACK_MODES.map(mode => {
                                        const isUsedMega = mode.id === 'mega' && state.megaUsed[pIdx];
                                        const isSel = state.selectedAtk[pIdx].id === mode.id;
                                        return `
                                            <button onclick="changeAttack(${pIdx}, '${mode.id}')" 
                                                ${isUsedMega ? 'disabled' : ''}
                                                class="flex-1 py-3 rounded-xl border-2 text-[9px] font-black uppercase tracking-widest transition-all ${isSel ? `border-white ${mode.color} scale-105 shadow-lg` : 'border-white/5 bg-slate-900/50 text-slate-500'} ${isUsedMega ? 'opacity-10 grayscale' : ''}">
                                                ${mode.name}
                                            </button>
                                        `;
                                    }).join('')}
                                </div>
                                
                                <div class="options-grid">
                                    ${q.options.map((opt, optI) => `
                                        <button onclick="handleAnswer(${pIdx}, ${optI})" 
                                            class="btn-cyber p-6 rounded-2xl border-2 border-white/10 bg-slate-900 text-[12px] font-black hover:bg-white hover:text-black hover:border-white uppercase transition-all shadow-md">
                                            ${opt}
                                        </button>
                                    `).join('')}
                                </div>

                                ${state.hasAnswered[pIdx] ? `
                                    <div class="absolute inset-0 flex flex-col items-center justify-center lockout-overlay z-10">
                                        <div class="p-8 bg-black border border-white/10 rounded-3xl flex flex-col items-center shadow-2xl">
                                            <i data-lucide="lock" class="w-12 h-12 text-rose-500 mb-4 animate-pulse"></i>
                                            <span class="text-sm font-black uppercase text-rose-500 tracking-[0.3em] text-center italic tracking-widest">БҰҒАТТАЛДЫ</span>
                                        </div>
                                    </div>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }
        if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function handleStart() {
        if (apiKey || typeof __initial_auth_token !== 'undefined') {
            fetchQuestions(state.topic);
        } else {
            // Егер кілт болмаса, базалық сұрақтармен бірден бастау
            gameQuestions = [...PYTHON_BASE];
            initBattle();
        }
    }

    function changeAttack(pIdx, modeId) {
        if (modeId === 'mega' && state.megaUsed[pIdx]) return;
        state.selectedAtk[pIdx] = ATTACK_MODES.find(m => m.id === modeId);
        render();
    }

    function handleAnswer(pIdx, optIdx) {
        if (state.gameState !== 'battle' || state.anim || state.hasAnswered[pIdx]) return;

        const q = gameQuestions[state.qIdx];
        const isCorrect = optIdx === q.correct;
        const opponentIdx = pIdx === 0 ? 1 : 0;
        const mode = state.selectedAtk[pIdx];

        if (isCorrect) {
            if (mode.id === 'mega') state.megaUsed[pIdx] = true;
            state.hp[opponentIdx] = Math.max(0, state.hp[opponentIdx] - mode.damage);
            if (mode.heal > 0) state.hp[pIdx] = Math.min(100, state.hp[pIdx] + mode.heal);
            state.anim = { type: 'hit', text: `КРИТИКАЛЫҚ: -${mode.damage}HP` };
            render();

            setTimeout(() => {
                state.anim = null;
                if (mode.id === 'mega') state.selectedAtk[pIdx] = ATTACK_MODES[0];
                if (state.hp[opponentIdx] <= 0) {
                    state.winner = pIdx;
                    state.gameState = 'result';
                    render();
                } else {
                    nextRound();
                }
            }, 1200);
        } else {
            state.hp[pIdx] = Math.max(0, state.hp[pIdx] - mode.selfDmg);
            state.hasAnswered[pIdx] = true;
            state.anim = { type: 'miss', text: `ERROR: -${mode.selfDmg}` };
            render();

            setTimeout(() => {
                state.anim = null;
                if (state.hp[pIdx] <= 0) {
                    state.winner = opponentIdx;
                    state.gameState = 'result';
                    render();
                } else if (state.hasAnswered[0] && state.hasAnswered[1]) {
                    nextRound();
                } else {
                    render();
                }
            }, 1200);
        }
    }

    function nextRound() {
        if (state.qIdx < gameQuestions.length - 1) {
            state.gameState = 'round_sync';
            state.loadingMsg = "КЕЛЕСІ ПРОТОКОЛДЫ ЖҮКТЕУ...";
            render();
            
            setTimeout(() => {
                state.qIdx++;
                state.hasAnswered = [false, false];
                state.gameState = 'battle';
                render();
            }, 2000);
        } else {
            state.winner = state.hp[0] > state.hp[1] ? 0 : 1;
            state.gameState = 'result';
            render();
        }
    }

    window.onload = render;
</script>
</body>
</html>
